[package]
name = "bullet"
version = "0.2.0"
description = "A small text-to-action desktop entry point"
edition = "2021"
rust-version = "1.90"

[lib]
name = "bullet_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "bullet"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
dirs = "6"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
