name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Guard: the pushed tag must match the version in tauri.conf.json,
      # otherwise the installer would carry a different version than the tag.
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            exit 1
          }

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npm run desktop:build -- -- --locked

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
